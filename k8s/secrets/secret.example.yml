# TEMPLATE ONLY. Never commit real values.
# Copy to secret.yml (gitignored), fill in real values, then:
#   kubectl apply -f k8s/secrets/secret.yml
# Or skip the file and create the Secret directly:
#   kubectl -n opsdesk create secret generic opsdesk-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=JWT_SIGNING_KEY="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_URL='postgres://<user>:<password>@<host>:5432/<db>'
apiVersion: v1
kind: Secret
metadata:
  name: opsdesk-secrets
  namespace: opsdesk
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "<output of: openssl rand -base64 48>"
  JWT_SIGNING_KEY: "<a different output of: openssl rand -base64 48>"
  DATABASE_URL: "postgres://<user>:<password>@<host>:5432/<db>"
  EMAIL_HOST_PASSWORD: ""
