

apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: opsdesk
spec:
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: beat
        image: abednegotenge/opsdesk-backend:latest
        command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
        envFrom:
          - configMapRef:
              name: opsdesk-config
          - secretRef:
              name: opsdesk-secret
        livenessProbe:
          exec:
            command: ["python", "-m", "opsdesk_tasks.healthcheck", "beat", "--max-age", "60"]
          initialDelaySeconds: 30
          periodSeconds: 30
      resources:
        requests: {
          cpu: 50m,
          memory: 128Mi
        }
        limits: { memory: 256Mi }
